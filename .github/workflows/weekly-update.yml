name: Weekly pkgver refresh

on:
  schedule:
    # 18:00 UTC = noon America/Chicago during CST (winter). During CDT
    # (roughly Mar-Nov) this fires at 1pm Central instead of noon, since
    # GitHub Actions cron is fixed UTC and doesn't shift for DST.
    - cron: '0 18 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute latest upstream pkgver
        id: ver
        run: |
          git clone --quiet https://github.com/GloriousEggroll/proton-ge-custom.git _upstream
          cd _upstream
          NEWVER="$(git describe --long --abbrev=7 2>/dev/null \
            | sed 's/\([^-]*-g\)/r\1/;s/-/./g')"
          cd ..
          rm -rf _upstream
          echo "newver=${NEWVER}" >> "$GITHUB_OUTPUT"

      - name: Bump PKGBUILD
        id: bump
        run: |
          NEWVER="${{ steps.ver.outputs.newver }}"
          CURVER="$(grep -m1 '^pkgver=' PKGBUILD | cut -d= -f2)"

          if [[ "$NEWVER" != "$CURVER" ]]; then
            sed -i "s/^pkgver=.*/pkgver=${NEWVER}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            CURREL="$(grep -m1 '^pkgrel=' PKGBUILD | cut -d= -f2)"
            sed -i "s/^pkgrel=.*/pkgrel=$((CURREL + 1))/" PKGBUILD
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        id: commit
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD
          git commit -m "chore: weekly pkgver refresh"
          git push origin main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Pushes made with the default GITHUB_TOKEN (the "Commit and push" step
      # above) don't trigger other workflows, so aur-publish.yml's `on: push`
      # never fires for this bot commit. Publish inline instead of relying on
      # that chain.
      - name: Publish to AUR
        if: steps.bump.outputs.changed == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v2.7.2
        with:
          pkgname: proton-ge-git
          pkgbuild: ./PKGBUILD
          assets: |
            proton-ge-git.install
            launcher.sh
            user_settings.py
            pam_limits.conf
            proton-ge-custom-bin.conf
          commit_username: ${{ github.actor }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "update from GitHub ${{ steps.commit.outputs.sha }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          allow_empty_commits: false
          force_push: false
